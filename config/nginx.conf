# news.grayzhang.com is a personal mirror of the same output — keep it out of
# search indexes entirely so it can never compete with the SEO primary domain.
# Empty value for other hosts = header omitted (nginx drops empty add_header).
# Requires the Cloudflare tunnel to pass the original Host header through
# (cloudflared default); verified post-deploy via the public URL.
map $host $robots_noindex {
    default "";
    news.grayzhang.com "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_noindex always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' https://stats.moguiyu.top; img-src 'self' data:; connect-src 'self' https://stats.moguiyu.top; worker-src 'self'; manifest-src 'self';" always;

    # Serve latest report at root
    location = / {
        expires -1;
        try_files /latest/index.html /index.html =404;
    }

    # SEO discovery files — plain text / XML, no caching
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        add_header Content-Type "text/plain; charset=utf-8";
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/xml; charset=utf-8";
    }
    location = /feed.xml {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/rss+xml; charset=utf-8";
    }

    # Date-specific reports: /2026-02-21/
    # Quoted regex: avoids nginx block-parser conflict with {n} quantifiers
    # expires -1 (not add_header) so server-level security headers keep applying
    location ~* "^/\d{4}-\d{2}-\d{2}/" {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    # Legacy rotating aliases — still resolvable (bookmarks/indexed URLs), no
    # longer linked from any page; date URLs are the canonical targets now
    location /p/ {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    # Archive index of all daily reports
    location = /archive/ {
        expires -1;
    }

    # Legacy /en/ prefix (live for a few hours on 2026-08-14) → English now
    # lives at the site root. Absolute https Location: the origin speaks plain
    # http behind the Cloudflare tunnel, and CF absolutizes relative Locations
    # with the origin scheme — so emit the final https URL ourselves.
    location /en/ {
        rewrite ^/en/(.*)$ https://news.moguiyu.top/$1 permanent;
    }

    # Chinese edition (/cn/ serves the latest Chinese report)
    location = /cn/ {
        expires -1;
        try_files /cn/latest/index.html =404;
    }
    location /cn/ {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    # PWA manifest — no cache so updates are picked up immediately
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    # Service worker — must be served from root scope, no cache
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Static assets
    location ~* \.(css|js|json|ico|png|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # No caching for HTML (expires -1 keeps security-header inheritance intact)
    location ~* \.html$ {
        expires -1;
    }
}
